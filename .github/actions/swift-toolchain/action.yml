name: Swift toolchain
description: >-
  Installs swiftly 1.2.0 and the Swift toolchain that `.swift-version` names, and puts swiftly's
  `swift` first on PATH, so CI runs the compiler that contributors run.
runs:
  using: composite
  steps:
    - name: Install swiftly and the pinned toolchain
      shell: bash
      run: |
        set -euo pipefail
        # The checksum pins the signed and notarized swiftly 1.2.0 installer.
        package="$RUNNER_TEMP/swiftly-1.2.0.pkg"
        curl --fail --silent --show-error --location --output "$package" \
          https://download.swift.org/swiftly/darwin/swiftly-1.2.0.pkg
        echo "a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987  $package" \
          | shasum -a 256 --check
        installer -pkg "$package" -target CurrentUserHomeDirectory
        "$HOME/.swiftly/bin/swiftly" init --assume-yes --no-modify-profile --skip-install \
          --quiet-shell-followup
        # With no version, swiftly installs the toolchain that `.swift-version` names.
        "$HOME/.swiftly/bin/swiftly" install --assume-yes
        echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
